# 301-redirects van de oude WordPress-pagina's naar de nieuwe one-pager.
# Plaats binnen het server{} block van crossfitbergenopzoom.nl.
# Let op: een fragment (#anchor) wordt niet door de server gestuurd maar door de
# browser bewaard, dus dit werkt alleen als de redirect het fragment meegeeft.

location = /wat-is-crossfit/ { return 301 /#crossfit; }
location = /de-crossfit-methode/ { return 301 /#community; }
location = /is-crossfit-iets-voor-mij/ { return 301 /#faq; }
location = /lessen/ { return 301 /#programmas; }
location = /lessen/kids-training/ { return 301 /#crossfit-kids; }
location = /lessen/personal-training/ { return 301 /#private-coaching; }
location = /lessen/90-days-challenge/ { return 301 /#tarieven; }
location = /fitness/ { return 301 /#circuittraining; }
location = /trainers/ { return 301 /#founder; }
location = /tarieven/ { return 301 /#tarieven; }
location = /contact/ { return 301 /#contact; }
location = /binnenkort-beschikbaar/ { return 301 /#rooster; }
location = /category/uncategorized/ { return 301 /; }
location = /feed/ { return 301 /; }
location = /comments/feed/ { return 301 /; }

# feeds van losse posts
location ~ ^/.+/feed/?$ { return 301 /; }
