name: Deploy naar SiteGround

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nooit twee deploys tegelijk naar dezelfde public_html, en een lopende deploy
# niet halverwege afbreken: dat zou een halve site achterlaten.
concurrency:
  group: deploy-siteground
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage de publiceerbare bestanden
        run: |
          # Bewust via git archive en niet via rsync vanaf de werkmap: dan bevat
          # de publicatie exact wat gecommit is. rsync leest .gitignore niet en
          # zou images-smaller/, original-images/ en reference-images/ meenemen,
          # inclusief de beeldbanken van Powermama en ZilverFitness.
          mkdir -p _site
          git archive HEAD | tar -x -C _site
          cp redirects/.htaccess _site/.htaccess
          rm -rf _site/redirects _site/.github _site/.gitignore
          echo "Te publiceren: $(find _site -type f | wc -l) bestanden, $(du -sh _site | cut -f1)"
          find _site -maxdepth 1 | sort
          # harde grens: een statische one-pager hoort nooit tientallen MB te zijn
          kb=$(du -sk _site | cut -f1)
          if [ "$kb" -gt 30000 ]; then
            echo "AFGEBROKEN: _site is ${kb}KB, dat is te groot. Controleer wat er gecommit is." >&2
            exit 1
          fi

      - name: SSH-sleutel klaarzetten
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SG_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # host vooraf vastleggen, zodat StrictHostKeyChecking aan kan blijven
          ssh-keyscan -p 18765 "${{ secrets.SG_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync naar public_html
        run: |
          rsync -az --delete \
            --exclude '.well-known/' \
            --exclude '.htpasswd' \
            --exclude 'cgi-bin/' \
            -e "ssh -p 18765 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            _site/ "${{ secrets.SG_USER }}@${{ secrets.SG_HOST }}:${{ secrets.SG_PATH }}/"

      - name: Controleer de live site
        run: |
          sleep 5
          fail=0

          code=$(curl -s -o /dev/null -w '%{http_code}' https://crossfitbergenopzoom.nl/)
          echo "homepage            : $code"
          [ "$code" = "200" ] || fail=1

          # de oude pagina's moeten een echte 301 geven, mét het anker
          for p in /wat-is-crossfit/ /lessen/ /tarieven/ /contact/ /binnenkort-beschikbaar/; do
            line=$(curl -sI "https://crossfitbergenopzoom.nl$p" | tr -d '\r')
            status=$(printf '%s' "$line" | head -1 | awk '{print $2}')
            loc=$(printf '%s' "$line" | grep -i '^location:' | head -1)
            echo "$p -> $status $loc"
            [ "$status" = "301" ] || fail=1
          done

          # WordPress hoort weg te zijn
          wp=$(curl -s -o /dev/null -w '%{http_code}' https://crossfitbergenopzoom.nl/wp-login.php)
          echo "wp-login.php        : $wp (404 verwacht)"

          exit $fail
