name: Deploy naar SiteGround

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nooit twee deploys tegelijk naar dezelfde public_html, en een lopende deploy
# niet halverwege afbreken: dat zou een halve site achterlaten.
concurrency:
  group: deploy-siteground
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage de publiceerbare bestanden
        run: |
          # Bewust via git archive en niet via rsync vanaf de werkmap: dan bevat
          # de publicatie exact wat gecommit is. rsync leest .gitignore niet en
          # zou images-smaller/, original-images/ en reference-images/ meenemen,
          # inclusief de beeldbanken van Powermama en ZilverFitness.
          mkdir -p _site
          git archive HEAD | tar -x -C _site
          cp redirects/.htaccess _site/.htaccess
          rm -rf _site/redirects _site/.github _site/.gitignore _site/tools
          # interne documentatie hoort niet op een publieke bedrijfssite
          find _site -name '*.md' -delete
          echo "Te publiceren: $(find _site -type f | wc -l) bestanden, $(du -sh _site | cut -f1)"
          find _site -maxdepth 1 | sort
          # harde grens: een statische one-pager hoort nooit tientallen MB te zijn
          kb=$(du -sk _site | cut -f1)
          if [ "$kb" -gt 30000 ]; then
            echo "AFGEBROKEN: _site is ${kb}KB, dat is te groot. Controleer wat er gecommit is." >&2
            exit 1
          fi

      - name: SSH-sleutel klaarzetten
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SG_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # host vooraf vastleggen, zodat StrictHostKeyChecking aan kan blijven
          ssh-keyscan -p 18765 "${{ secrets.SG_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Documentroot bepalen
        id: docroot
        env:
          SITE_DOMAIN: crossfitbergenopzoom.nl
        run: |
          SSH="ssh -p 18765 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes ${{ secrets.SG_USER }}@${{ secrets.SG_HOST }}"
          PATH_SET="${{ secrets.SG_PATH }}"
          if [ -n "$PATH_SET" ]; then
            echo "SG_PATH is opgegeven: $PATH_SET"
            DOC="$PATH_SET"
          else
            # SG_PATH niet ingesteld: zelf zoeken, maar op naam en niet op volgorde.
            # Er staan twee sites op dit account, crossfit-bergenopzoom.nl en
            # crossfitbergenopzoom.nl. Een "ls | head -1" pakt de eerste, en dat is
            # door het koppelteken juist de verkeerde.
            echo "SG_PATH leeg, documentroot opzoeken op de server..."
            DOC=$($SSH "ls -d ~/www/$SITE_DOMAIN/public_html 2>/dev/null")
            if [ -z "$DOC" ]; then
              echo "Geen public_html voor $SITE_DOMAIN. Dit staat er wel:" >&2
              $SSH 'ls -d ~/www/*/public_html' >&2
              exit 1
            fi
            echo "Gevonden: $DOC"
          fi
          # Vangnet. rsync --delete naar een leeg of verkeerd pad is destructief:
          # een lege SG_PATH maakte van de bestemming "user@host:/".
          case "$DOC" in
            ""|"/"|"~"|"$HOME") echo "GEWEIGERD: onveilige bestemming '$DOC'." >&2; exit 1 ;;
          esac
          case "$DOC" in
            */public_html) : ;;
            *) echo "GEWEIGERD: '$DOC' eindigt niet op public_html." >&2; exit 1 ;;
          esac
          case "$DOC" in
            *"/$SITE_DOMAIN/"*) : ;;
            *) echo "GEWEIGERD: '$DOC' hoort niet bij $SITE_DOMAIN." >&2; exit 1 ;;
          esac
          echo "Bestemming: $DOC"
          echo "docroot=$DOC" >> "$GITHUB_OUTPUT"

      - name: Rsync naar public_html
        run: |
          rsync -az --delete \
            --exclude '.well-known/' \
            --exclude '.htpasswd' \
            --exclude 'cgi-bin/' \
            -e "ssh -p 18765 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            _site/ "${{ secrets.SG_USER }}@${{ secrets.SG_HOST }}:${{ steps.docroot.outputs.docroot }}/"

      - name: Controleer de deploy
        env:
          SITE_DOMAIN: crossfitbergenopzoom.nl
        run: |
          # Bewust via SSH en niet via HTTP. SiteGround beantwoordt verzoeken uit
          # datacenters met een 202 bot-check, ook mét browser-user-agent, dus een
          # HTTP-controle vanaf een runner zegt niets. Op de server zelf kijken is
          # bovendien immuun voor de dynamische cache: het toont wat er echt staat.
          SSH="ssh -p 18765 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes ${{ secrets.SG_USER }}@${{ secrets.SG_HOST }}"
          DOC="${{ steps.docroot.outputs.docroot }}"
          fail=0

          LOCAL=$(sha256sum _site/index.html | cut -d' ' -f1)
          REMOTE=$($SSH "sha256sum '$DOC/index.html' 2>/dev/null | cut -d' ' -f1")
          echo "index.html lokaal : $LOCAL"
          echo "index.html server : $REMOTE"
          if [ "$LOCAL" = "$REMOTE" ] && [ -n "$REMOTE" ]; then
            echo "  -> identiek"
          else
            echo "  -> WIJKT AF of ontbreekt" >&2; fail=1
          fi

          echo "--- moet aanwezig zijn ---"
          for f in .htaccess 404.html robots.txt sitemap.xml favicon.ico; do
            if $SSH "test -f '$DOC/$f'"; then echo "  ok      $f"; else echo "  ONTBREEKT $f" >&2; fail=1; fi
          done

          echo "--- mag er niet staan ---"
          for f in wp-login.php wp-config.php wp-admin readme.html HANDOVER.md; do
            if $SSH "test -e '$DOC/$f'"; then echo "  AANWEZIG $f" >&2; fail=1; else echo "  weg     $f"; fi
          done

          echo "--- .well-known moet de rsync overleefd hebben ---"
          if $SSH "test -d '$DOC/.well-known'"; then
            echo "  ok      .well-known (SSL-verlenging)"
          else
            echo "  ONTBREEKT .well-known: SSL kan straks niet verlengen" >&2; fail=1
          fi

          # Informatief: een 202 hier is bot-bescherming, geen storing.
          echo "--- extern (informatief) ---"
          for p in / /tarieven/ /wat-is-crossfit/; do
            echo "  $p -> $(curl -s -o /dev/null -w '%{http_code}' "https://$SITE_DOMAIN$p")"
          done

          exit $fail
