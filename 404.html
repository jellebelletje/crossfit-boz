<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 | CrossFit Bergen op Zoom</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#F5D300">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-0: #0A0A0A; --bg-2: #1C1C1C;
  --line: #262626; --line-bright: #3A3A3A;
  --text: #FAFAFA; --text-read: #A8A8A8; --text-low: #5A5A5A;
  --yellow: #F5D300; --yellow-hot: #FFE500;
  --font-display: 'Big Shoulders Display', sans-serif;
  --font-body: 'Figtree', sans-serif;
  --font-signal: 'Archivo Black', sans-serif;
  --gutter: clamp(1.25rem, 3vw, 3rem);
  --hexagon: polygon(50% 0%, 93.3% 25%, 93.3% 75%, 50% 100%, 6.7% 75%, 6.7% 25%);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; }
body {
  background: var(--bg-0); color: var(--text); font-family: var(--font-body);
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 3rem var(--gutter); position: relative; overflow-x: hidden;
}
/* dezelfde korrel als op de homepage */
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 10; opacity: 0.035;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  mix-blend-mode: overlay;
}
.hex { position: absolute; clip-path: var(--hexagon); background: rgba(245,211,0,0.045); pointer-events: none; }
.hex.a { width: 320px; height: 369px; top: -90px; right: -80px; }
.hex.b { width: 200px; height: 231px; bottom: -60px; left: -50px; border: 1px solid rgba(245,211,0,0.12); background: transparent; }

.wrap { position: relative; z-index: 2; max-width: 720px; text-align: center; }

.eyebrow { display: inline-flex; align-items: center; gap: 0.75rem; margin-bottom: 2rem; }
.eyebrow .tick { width: 40px; height: 2px; background: var(--yellow); }
.eyebrow span { font-family: var(--font-signal); font-size: 0.7rem; letter-spacing: 0.18em; color: var(--yellow); }

/* De nul in het midden is de losgelaten schijf. Roteren doet bij een cirkel
   niets zichtbaars, dus hij hangt lager dan de vieren: dát leest als gevallen. */
.code { display: flex; align-items: flex-start; justify-content: center; gap: 0.06em; line-height: 0.8; margin-bottom: 2rem; }
.code span { align-self: flex-start; font-family: var(--font-display); font-weight: 900; font-size: clamp(7rem, 26vw, 15rem); letter-spacing: -0.03em; }
.plate {
  display: inline-block; width: clamp(5.2rem, 19vw, 11rem); height: clamp(5.2rem, 19vw, 11rem);
  border-radius: 50%; border: clamp(0.9rem, 3.4vw, 2rem) solid var(--yellow);
  background: var(--bg-2); flex-shrink: 0; align-self: flex-end;
  transform: translateY(14%); box-shadow: 0 18px 40px rgba(0,0,0,0.6);
}
h1 { font-family: var(--font-display); font-weight: 900; font-size: clamp(1.75rem, 5.5vw, 3.4rem); line-height: 1; text-transform: uppercase; letter-spacing: -0.01em; margin-bottom: 1.25rem; }
h1 .yel { color: var(--yellow); }
.sub { color: var(--text-read); font-size: 1.05rem; line-height: 1.6; max-width: 460px; margin: 0 auto 2.5rem; }

.btn { background: var(--yellow); color: var(--bg-0); padding: 1rem 1.8rem; font-family: var(--font-signal); font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none; transition: background 0.2s, transform 0.2s; min-height: 44px; }
.btn:hover { background: var(--yellow-hot); transform: translateY(-2px); }

.more { margin-top: 2.5rem; padding-top: 1.75rem; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 0.4rem 1.5rem; justify-content: center; }
.more a { font-family: var(--font-signal); font-size: 0.64rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-low); text-decoration: none; min-height: 44px; display: inline-flex; align-items: center; transition: color 0.2s; }
.more a:hover { color: var(--yellow); }

@media (max-width: 560px) {
  .code { gap: 0; }
  .more { gap: 0 1rem; }
}
</style>
</head>
<body>
<div class="hex a"></div>
<div class="hex b"></div>

<main class="wrap">
  <div class="eyebrow"><span class="tick"></span><span>404</span></div>

  <div class="code" aria-hidden="true">
    <span>4</span><span class="plate"></span><span>4</span>
  </div>

  <h1>Ooops looks like you<br><span class="yel">dropped your barbell</span></h1>
  <p class="sub">Deze pagina bestaat niet (meer). Laat hem liggen en pak de volgende set.</p>

  <a class="btn" href="/">Go home →</a>

  <nav class="more">
    <a href="/#programmas">Programma's</a>
    <a href="/#rooster">Rooster</a>
    <a href="/#tarieven">Tarieven</a>
    <a href="/#faq">Vragen</a>
    <a href="/#contact">Contact</a>
  </nav>
</main>
</body>
</html>
